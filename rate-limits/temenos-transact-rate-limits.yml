specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Temenos Transact
providerId: temenos-transact
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Core Banking
  - Financial Services
description: >-
  Temenos Transact APIs are exposed inside a bank-deployed product (on-premise, dedicated cloud, or Temenos
  Banking Cloud SaaS); throughput is governed by the customer's deployment sizing and contract rather
  than by a public shared-tenancy quota. There is no public Transact rate-limits reference for general
  developers.
sources:
  - https://www.temenos.com/products/core-banking/transact/
  - https://www.temenos.com/contact/
notes: >-
  No public rate-limits documentation. Limits are defined per Transact deployment / contract.
responseCodes: {}
limits:
  - name: Deployment-Defined
    scope: contract
    metric: varies
    limit: defined per Temenos Transact deployment / customer contract
policies:
  - name: Deployment Capacity
    description: Throughput depends on deployment topology and the sizing agreed with Temenos at provisioning.
