naftiko: 1.0.0-alpha2
info:
  label: Temenos Digital Banking
  description: Unified digital banking capability combining account management, customer operations, payment processing, deposits,
    loans, and reference data for retail and corporate banking applications. Used by digital banking developers and fintech
    integration teams.
  tags:
  - Temenos
  - Digital Banking
  - Core Banking
  - Payments
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    TEMENOS_BEARER_TOKEN: TEMENOS_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: core-banking
    baseUri: https://api.temenos.com/api/v1.0.0
    description: Temenos Transact Core Banking API for accounts, customers, payments, deposits, loans, and reference data.
    authentication:
      type: bearer
      token: '{{TEMENOS_BEARER_TOKEN}}'
    resources:
    - name: accounts
      path: /holdings/accounts
      description: Customer account management
      operations:
      - name: list-accounts
        method: GET
        description: Retrieve a list of customer accounts
        inputParameters:
        - name: page_size
          in: query
          type: integer
          required: false
          description: Number of records per page
        - name: customerId
          in: query
          type: string
          required: false
          description: Filter by customer identifier
        - name: accountType
          in: query
          type: string
          required: false
          description: Filter by account type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-account
        method: GET
        description: Retrieve account details by ID
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
          description: Unique account identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-account
        method: PUT
        description: Update an existing account
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
          description: Unique account identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            accountName: '{{tools.accountName}}'
      - name: get-account-balances
        method: GET
        description: Retrieve balance information for an account
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
          description: Unique account identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-account-transactions
        method: GET
        description: Retrieve transaction history for an account
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
          description: Unique account identifier
        - name: fromDate
          in: query
          type: string
          required: false
          description: Start date filter
        - name: toDate
          in: query
          type: string
          required: false
          description: End date filter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: customers
      path: /party/customers
      description: Customer profile management
      operations:
      - name: list-customers
        method: GET
        description: Retrieve a list of customers
        inputParameters:
        - name: customerName
          in: query
          type: string
          required: false
          description: Filter by customer name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-customer
        method: POST
        description: Create a new customer record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            shortName: '{{tools.shortName}}'
            customerMnemonic: '{{tools.customerMnemonic}}'
            sectorId: '{{tools.sectorId}}'
      - name: get-customer
        method: GET
        description: Retrieve customer details
        inputParameters:
        - name: customerId
          in: path
          type: string
          required: true
          description: Customer identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-customer
        method: PUT
        description: Update customer details
        inputParameters:
        - name: customerId
          in: path
          type: string
          required: true
          description: Customer identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            customerNames: '{{tools.customerNames}}'
      - name: get-customer-accounts
        method: GET
        description: Retrieve accounts for a customer
        inputParameters:
        - name: customerId
          in: path
          type: string
          required: true
          description: Customer identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: payments
      path: /order
      description: Payment processing operations
      operations:
      - name: create-fund-transfer
        method: POST
        description: Initiate a fund transfer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            debitAccountId: '{{tools.debitAccountId}}'
            creditAccountId: '{{tools.creditAccountId}}'
            amount: '{{tools.amount}}'
      - name: get-fund-transfer
        method: GET
        description: Get fund transfer details
        inputParameters:
        - name: transferId
          in: path
          type: string
          required: true
          description: Transfer identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-payment-orders
        method: GET
        description: List payment orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-payment-order
        method: POST
        description: Create a payment order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            debitAccountId: '{{tools.debitAccountId}}'
            debitAmount: '{{tools.debitAmount}}'
      - name: get-payment-order
        method: GET
        description: Get payment order details
        inputParameters:
        - name: paymentOrderId
          in: path
          type: string
          required: true
          description: Payment order identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: cancel-payment-order
        method: POST
        description: Cancel a payment order
        inputParameters:
        - name: paymentOrderId
          in: path
          type: string
          required: true
          description: Payment order identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-standing-orders
        method: GET
        description: List standing orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-standing-order
        method: POST
        description: Create a standing order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            accountId: '{{tools.accountId}}'
            amount: '{{tools.amount}}'
            frequency: '{{tools.frequency}}'
    - name: deposits
      path: /holdings/deposits
      description: Deposit arrangement management
      operations:
      - name: list-deposits
        method: GET
        description: List deposit arrangements
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-deposit
        method: GET
        description: Get deposit details
        inputParameters:
        - name: depositId
          in: path
          type: string
          required: true
          description: Deposit identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: loans
      path: /holdings/loans
      description: Loan arrangement management
      operations:
      - name: list-loans
        method: GET
        description: List loan arrangements
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-loan
        method: GET
        description: Get loan details
        inputParameters:
        - name: loanId
          in: path
          type: string
          required: true
          description: Loan identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: beneficiaries
      path: /party/beneficiaries
      description: Payment beneficiary management
      operations:
      - name: list-beneficiaries
        method: GET
        description: List registered beneficiaries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-beneficiary
        method: POST
        description: Register a new beneficiary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            customerId: '{{tools.customerId}}'
            beneficiaryName: '{{tools.beneficiaryName}}'
    - name: products
      path: /product/products
      description: Product catalog
      operations:
      - name: list-products
        method: GET
        description: List banking products
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: reference
      path: /reference
      description: Reference data
      operations:
      - name: list-currencies
        method: GET
        description: List available currencies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-countries
        method: GET
        description: List available countries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: validate-iban
        method: GET
        description: Validate an IBAN
        inputParameters:
        - name: iban
          in: path
          type: string
          required: true
          description: IBAN to validate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: cards
      path: /holdings/cards
      description: Card management
      operations:
      - name: list-cards
        method: GET
        description: List debit and credit cards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-card
        method: GET
        description: Get card details
        inputParameters:
        - name: cardId
          in: path
          type: string
          required: true
          description: Card identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: digital-banking-api
    description: Unified REST API for digital banking operations.
    resources:
    - path: /v1/accounts
      name: accounts
      description: Account management
      operations:
      - method: GET
        name: list-accounts
        description: List customer accounts
        call: core-banking.list-accounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{accountId}
      name: account-details
      description: Account details
      operations:
      - method: GET
        name: get-account
        description: Get account details
        call: core-banking.get-account
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{accountId}/balances
      name: account-balances
      description: Account balances
      operations:
      - method: GET
        name: get-account-balances
        description: Get account balances
        call: core-banking.get-account-balances
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{accountId}/transactions
      name: account-transactions
      description: Transaction history
      operations:
      - method: GET
        name: get-account-transactions
        description: Get transaction history
        call: core-banking.get-account-transactions
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/customers
      name: customers
      description: Customer management
      operations:
      - method: GET
        name: list-customers
        description: List customers
        call: core-banking.list-customers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-customer
        description: Create a customer
        call: core-banking.create-customer
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/payments
      name: payments
      description: Payment operations
      operations:
      - method: GET
        name: list-payment-orders
        description: List payment orders
        call: core-banking.list-payment-orders
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-payment-order
        description: Create a payment order
        call: core-banking.create-payment-order
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/transfers
      name: transfers
      description: Fund transfers
      operations:
      - method: POST
        name: create-fund-transfer
        description: Initiate a fund transfer
        call: core-banking.create-fund-transfer
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: digital-banking-mcp
    transport: http
    description: MCP server for AI-assisted digital banking operations.
    tools:
    - name: list-accounts
      description: List customer accounts with optional filters
      hints:
        readOnly: true
        openWorld: true
      call: core-banking.list-accounts
      outputParameters:
      - type: object
        mapping: $.
    - name: get-account
      description: Get account details by ID
      hints:
        readOnly: true
      call: core-banking.get-account
      with:
        accountId: tools.accountId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-account-balances
      description: Get account balance information
      hints:
        readOnly: true
      call: core-banking.get-account-balances
      with:
        accountId: tools.accountId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-account-transactions
      description: Get transaction history for an account
      hints:
        readOnly: true
      call: core-banking.get-account-transactions
      with:
        accountId: tools.accountId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-customers
      description: List customers
      hints:
        readOnly: true
        openWorld: true
      call: core-banking.list-customers
      outputParameters:
      - type: object
        mapping: $.
    - name: get-customer
      description: Get customer details
      hints:
        readOnly: true
      call: core-banking.get-customer
      with:
        customerId: tools.customerId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-customer
      description: Create a new customer
      call: core-banking.create-customer
      with:
        shortName: tools.shortName
        customerMnemonic: tools.customerMnemonic
        sectorId: tools.sectorId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-customer-accounts
      description: List accounts for a customer
      hints:
        readOnly: true
      call: core-banking.get-customer-accounts
      with:
        customerId: tools.customerId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-fund-transfer
      description: Initiate a fund transfer between accounts
      call: core-banking.create-fund-transfer
      with:
        debitAccountId: tools.debitAccountId
        creditAccountId: tools.creditAccountId
        amount: tools.amount
      outputParameters:
      - type: object
        mapping: $.
    - name: get-fund-transfer
      description: Get fund transfer status and details
      hints:
        readOnly: true
      call: core-banking.get-fund-transfer
      with:
        transferId: tools.transferId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-payment-orders
      description: List payment orders
      hints:
        readOnly: true
        openWorld: true
      call: core-banking.list-payment-orders
      outputParameters:
      - type: object
        mapping: $.
    - name: create-payment-order
      description: Submit a payment order
      call: core-banking.create-payment-order
      with:
        debitAccountId: tools.debitAccountId
        debitAmount: tools.debitAmount
      outputParameters:
      - type: object
        mapping: $.
    - name: cancel-payment-order
      description: Cancel a pending payment order
      hints:
        destructive: true
      call: core-banking.cancel-payment-order
      with:
        paymentOrderId: tools.paymentOrderId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-deposits
      description: List deposit arrangements
      hints:
        readOnly: true
      call: core-banking.list-deposits
      outputParameters:
      - type: object
        mapping: $.
    - name: list-loans
      description: List loan arrangements
      hints:
        readOnly: true
      call: core-banking.list-loans
      outputParameters:
      - type: object
        mapping: $.
    - name: list-beneficiaries
      description: List payment beneficiaries
      hints:
        readOnly: true
      call: core-banking.list-beneficiaries
      outputParameters:
      - type: object
        mapping: $.
    - name: create-beneficiary
      description: Register a new payment beneficiary
      call: core-banking.create-beneficiary
      with:
        customerId: tools.customerId
        beneficiaryName: tools.beneficiaryName
      outputParameters:
      - type: object
        mapping: $.
    - name: list-products
      description: List banking products from the catalog
      hints:
        readOnly: true
      call: core-banking.list-products
      outputParameters:
      - type: object
        mapping: $.
    - name: list-currencies
      description: List available currencies
      hints:
        readOnly: true
      call: core-banking.list-currencies
      outputParameters:
      - type: object
        mapping: $.
    - name: validate-iban
      description: Validate an IBAN and resolve bank details
      hints:
        readOnly: true
      call: core-banking.validate-iban
      with:
        iban: tools.iban
      outputParameters:
      - type: object
        mapping: $.
    - name: list-cards
      description: List debit and credit cards
      hints:
        readOnly: true
      call: core-banking.list-cards
      outputParameters:
      - type: object
        mapping: $.
