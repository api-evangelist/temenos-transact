specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Temenos Transact
providerId: temenos-transact
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Core Banking
  - Financial Services
description: >-
  FOCUS-aligned FinOps scaffold for Temenos Transact. Sold as on-prem licenses or SaaS subscriptions to
  banks; commercial terms are sales-led and there is no public usage-based price list to map to FOCUS
  columns until a deployment is in place.
sources:
  - https://www.temenos.com/products/core-banking/transact/
  - https://www.temenos.com/contact/
  - https://focus.finops.org/focus-specification/v1-3/
notes: >-
  No public usage telemetry or programmatic billing surface. Reconciliation is deployment-specific.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Temenos AG
serviceCategory: Banking Software
billingModel:
  pricingCategory: Subscription
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Temenos Transact
  ServiceCategory: Banking Software
  ProviderName: Temenos
  PublisherName: Temenos AG
  InvoiceIssuerName: Temenos AG
  BillingCurrency: USD
meters:
  - name: license_fees
    unit: varies
    aggregation: sum
    dimensions:
      - module
      - deployment_model
principles:
  - name: Visibility
    description: Temenos invoices and the bank's internal cost-allocation systems are the primary visibility
      surface; no shared multi-tenant Transact usage API exists.
  - name: Allocation
    description: Allocate Transact license / SaaS spend across bank business units based on the Transact
      modules each consumes per the master agreement.
  - name: Optimization
    description: Right-size deployment topology, retire unused modules at renewal, and consolidate non-prod
      environments to reduce license footprint.
  - name: Accountability
    description: Bank core-banking program owner is accountable for Transact spend and reviews growth against
      contractual baselines at renewal.
